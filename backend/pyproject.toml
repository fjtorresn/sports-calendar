[project]
name = "sports-calendar-backend"
version = "0.1.0"
description = "API e ingesta de datos de Sports Calendar"
requires-python = ">=3.13"
# Rangos amplios aquí; las versiones exactas quedan fijadas en uv.lock.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El paquete importable se llama `app` (src/app), no como el proyecto.
module-name = "app"

[tool.ruff]
line-length = 119
target-version = "py313"
# Las migraciones las genera Alembic; no tiene sentido lintearlas.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: estilo (pep8) · F: errores lógicos (imports o variables sin usar)
# I: orden de imports · UP: sintaxis moderna de Python (list[] en vez de List[], etc.)
# B: patrones propensos a bugs (flake8-bugbear)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa `Depends(...)` y `Query(...)` como valores por defecto: es el patrón del framework.
"src/app/api/**" = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
