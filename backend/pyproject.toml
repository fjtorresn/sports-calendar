[project]
name = "sports-calendar-backend"
version = "0.1.0"
description = "Sports Calendar API and data ingestion"
requires-python = ">=3.13"
# Loose ranges here; exact versions are pinned in uv.lock.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "icalendar>=7.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The importable package is `app` (src/app), not the project name.
module-name = "app"

[tool.ruff]
line-length = 119
target-version = "py313"
# Migrations are generated by Alembic; no point linting them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: style (pep8) · F: logic errors (unused imports/variables)
# I: import order · UP: modern Python syntax (list[] instead of List[], etc.)
# B: bug-prone patterns (flake8-bugbear)
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `backend/alembic/` holds our migrations; the `alembic` import is still the third-party library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses `Depends(...)` and `Query(...)` as default values: that's the framework's pattern.
"src/app/api/**" = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
# A new deprecation or ORM warning fails the suite instead of going unnoticed.
filterwarnings = ["error"]
